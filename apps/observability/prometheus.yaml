apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-pods
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-pods
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-pods
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
          - name: prometheus
            image: quay.io/prometheus/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
            args:
              - --config.file=/etc/prometheus/prometheus.yml
              - --web.enable-otlp-receiver
              - --storage.tsdb.out-of-order-time-window=30m
            volumeMounts:
              - name: config-volume
                mountPath: /etc/prometheus
              - name: data-volume
                mountPath: /prometheus
      volumes:
          - name: config-volume
            configMap:
              name: prometheus-config
          - name: data-volume
            persistentVolumeClaim:
              claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: observability
spec:
  entryPoints:
    - web 
  routes:
    - match: Host(`prometheus.homelab`)
      kind: Rule
      services:
        - name: prometheus
          port: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
    otlp:
      keep_identifying_resource_attributes: true
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - "alertmanager.observability.svc.cluster.local:9093"
    rule_files:
      - "/etc/prometheus/alert_rules.yml"
    scrape_configs:
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
    - job_name: node-exporter
      static_configs:
      - targets:
        - node-exporter.observability.svc.cluster.local:9100
    - job_name: kube-state-metrics
      static_configs:
      - targets:
        - kube-state-metrics.observability.svc.cluster.local:8080
    - job_name: freebsd-nas
      static_configs:
      - targets:
        - 192.168.1.62:9100
    - job_name: otelcol-self
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - obi-system
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: namespace
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          regex: (.+)
          target_label: __metrics_path__


  alert_rules.yml: |
    groups:
      - name: target-down
        rules:
          - alert: TargetDown
            expr: up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Target is down"
              description: "{{ $labels.job }} target {{ $labels.instance }} has been down for more than 5 minutes."
      - name: otel-push
        rules:
          - alert: OtelIngestionStalled
            # Pushed data has no `up`; detect pipeline silence instead.
            expr: absent_over_time({__name__=~"http_server_request_duration_seconds_count|http_client_request_duration_seconds_count|rpc_server_call_duration_seconds_count|obi_instrumented_processes"}[15m])
            labels:
              severity: warning
            annotations:
              summary: "OTLP-pushed OBI metrics absent for 15m"
              description: "No OBI series received via native OTLP ingestion in 15m. Check obi-collector exporter errors (otelcol_exporter_send_failed_*) and that Prometheus runs with --web.enable-otlp-receiver."
