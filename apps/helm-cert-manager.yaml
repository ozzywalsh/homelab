apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 2h0m0s
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    semver: "^1.21.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: cert-manager
      version: "0.118.0"
      sourceRef:
        kind: OCIRepository
        name: cert-manager
  install:
    createNamespace: true
