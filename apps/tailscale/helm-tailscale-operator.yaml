apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 1h
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m

  chart:
    spec:
      chart: tailscale-operator
      sourceRef:
        kind: HelmRepository
        name: tailscale
      interval: 1h

  install:
    createNamespace: true

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    oauth:
      secret:
        name: tailscale-operator-oauth

    apiServerProxyConfig:
      mode: "true"
