apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jellyfin
  name: jellyfin
  namespace: qbitorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      volumes:
      - name: jellyfin-config
        persistentVolumeClaim:
          claimName: jellyfin-config-pvc
      - name: jellyfin-data
        persistentVolumeClaim:
          claimName: media
      - name: jellyfin-backups
        persistentVolumeClaim:
          claimName: jellyfin-backups
      - name: tailscale-state
        persistentVolumeClaim:
          claimName: jellyfin-tailscale-state
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      containers:
      - env:
        - name: TZ
          value: Europe/Dublin
        image: jellyfin/jellyfin:12.0
        name: jellyfin
        ports:
        - containerPort: 8096
          name: http-tcp
          protocol: TCP
        - containerPort: 8920
          name: https-tcp
          protocol: TCP
        - containerPort: 1900
          name: dlna-udp
          protocol: UDP
        - containerPort: 7359
          name: discovery-udp
          protocol: UDP
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "4000m"
            memory: "16Gi"
            devic.es/amd-render: 1
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - mountPath: /config
          name: jellyfin-config
        - mountPath: /config/data/backups
          name: jellyfin-backups
        - mountPath: /data
          name: jellyfin-data
      - name: tailscale
        image: tailscale/tailscale:v1.90
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_ADMIN
        env:
        - name: TS_USERSPACE
          value: "false"
        - name: TS_HOSTNAME
          value: jellyfin
        - name: TS_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: jellyfin-tailscale-auth
              key: client-id
        - name: TS_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: jellyfin-tailscale-auth
              key: client-secret
        - name: TS_EXTRA_ARGS
          value: --advertise-tags=tag:k8s
        readinessProbe:
          exec:
            command:
              - /usr/bin/tailscale
              - status
          initialDelaySeconds: 5
          periodSeconds: 20
        volumeMounts:
        - mountPath: /var/lib/tailscale
          name: tailscale-state
        - mountPath: /dev/net/tun
          name: tun
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: qbitorrent
spec:
  selector:
    app: jellyfin
  ports:
    - protocol: TCP
      port: 8096
      targetPort: 8096
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: qbitorrent
spec:
  entryPoints:
    - web 
  routes:
    - match: Host(`jellyfin.homelab`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096
    - match: Host(`jellyfin.ozzywalsh.com`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096
