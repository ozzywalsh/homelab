apiVersion: v1
kind: ServiceAccount
metadata:
  name: obi-collector
  namespace: obi-system
# ...
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obi
rules:
  - apiGroups: ['apps']
    resources: ['replicasets']
    verbs: ['list', 'watch']
  - apiGroups: ['']
    resources: ['pods', 'services', 'nodes']
    verbs: ['list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obi
subjects:
  - kind: ServiceAccount
    name: obi-collector
    namespace: obi-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obi
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: obi-collector
  namespace: obi-system
spec:
  mode: daemonset
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
  serviceAccount: obi-collector
  hostPID: true
  observability:
    metrics:
      enableMetrics: true
  env:
    - name: OTEL_EBPF_KUBE_CLUSTER_NAME
      # k8s.cluster.name on captured spans/metrics; env is the v2-receiver
      # equivalent (enrich config section is not allowed in receiver mode).
      value: homelab
  securityContext:
    runAsUser: 0
    readOnlyRootFilesystem: true
    capabilities:
      add:
        - BPF
        # CAP_KILL: the Java/Node injectors verify their target with
        # pidfd_send_signal(fd, 0); targets run as non-root (uid 1000 in the
        # store demo) so without KILL the signal-permission check returns
        # EPERM and Node.js/Java instrumentation is skipped with
        # "unable to capture stable ... injection target ... operation not
        # permitted" (procs/process_handle_linux.go Alive()).
        - KILL
        # CAP_SYS_CHROOT: setns(CLONE_NEWNS) into a target's mount namespace
        # (Java agent attach) requires ns_capable(own_user_ns, SYS_CHROOT) on
        # kernel 6.18 (fs/namespace.c mntns_install). Without it the java
        # injector fails with "failed to enter target mnt namespace" ->
        # "unsupported Java version".
        - SYS_CHROOT
        - SYS_PTRACE
        - NET_RAW
        - CHECKPOINT_RESTORE
        - DAC_READ_SEARCH
        - PERFMON
        - SYS_ADMIN
      drop:
        - ALL
  tolerations:
    - effect: NoSchedule
      operator: Exists
    - effect: NoExecute
      operator: Exists
  volumes:
    - name: var-run-obi
      emptyDir: {}
    - name: cgroup
      hostPath:
        path: /sys/fs/cgroup
    - name: bpffs
      hostPath:
        path: /sys/fs/bpf
    - name: tracefs
      hostPath:
        path: /sys/kernel/tracing
  volumeMounts:
    - name: var-run-obi
      mountPath: /var/run/obi
    - name: cgroup
      mountPath: /sys/fs/cgroup
    - name: bpffs
      mountPath: /sys/fs/bpf
    - name: tracefs
      mountPath: /sys/kernel/tracing
  config:
    receivers:
      obi:
        # OBI config v2 (receiver mode): capture sections sit beside `version`,
        # no enrich/correlation/daemon sections allowed. Migrated with
        # `obi config migrate --mode=receiver` (OBI v0.15.2) rules:
        #   discovery.instrument k8s_namespace -> policy/rules match.kubernetes
        #   attributes.kubernetes.enable -> default autodetect (no v2 equivalent)
        #   internal_metrics.exporter -> daemon section not allowed in receiver
        version: '2.0'
        policy:
          default_action: exclude
        rules:
          - action: exclude
            name: exclude-obi-and-collectors
            description: Exclude OBI and collector binaries to avoid self-instrumentation and collector recursion.
            match:
              process:
                exe_path_glob:
                  - '{*/obi,obi,*otelcol,*otelcol-contrib,*otelcol-contrib[!/]*}'
          - action: exclude
            name: exclude-system-namespaces
            description: Exclude platform/system namespaces from instrumentation.
            match:
              kubernetes:
                namespace_glob:
                  - kube-system
                  - kube-node-lease
                  - cert-manager
                  - gatekeeper-system
                  - observability
          - action: exclude
            name: exclude-otlp-exporters
            description: Exclude services that export OTLP themselves to avoid duplicate pipelines.
            match:
              process:
                exports_otlp:
                  port: 4317
                  protocol: protobuf
          - action: include
            name: qbitorrent
            match:
              kubernetes:
                namespace_glob: [qbitorrent]
          - action: include
            name: obi-store-demo
            match:
              kubernetes:
                namespace_glob: [obi-store-demo]
    exporters:
      otlp_http/prometheus:
        # Prometheus native OTLP receiver; exporter appends /v1/metrics.
        # (otlphttp was the deprecated alias of otlp_http — collector 0.164 warns.)
        endpoint: http://prometheus.observability.svc.cluster.local:9090/api/v1/otlp
    service:
      pipelines:
        metrics:
          receivers: [obi]
          exporters: [otlp_http/prometheus]
