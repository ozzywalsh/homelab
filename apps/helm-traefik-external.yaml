apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik-external
spec:
  interval: 2h0m0s
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-external
  namespace: traefik-external
spec:
  interval: 1h0m0s

  chart:
    spec:
      chart: traefik
      version: "41.0.2"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik-external

  install:
    createNamespace: true

  values:
    # Configure Network Ports and EntryPoints
    # EntryPoints are the network listeners for incoming traffic.
    ports:
      # HTTP entry point
      web:
        port: 80
        nodePort: 30000
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

      # HTTPS entry point
      websecure:
        port: 443
        nodePort: 30001

    # Enable dashboard
    api:
      dashboard: true
      insecure: false

    ingressRoute:
      dashboard:
        enabled: false
        matchRule: Host(`dashboard.docker.localhost`)
        entryPoints:
          - websecure
        middlewares:
          - name: dashboard-auth

    # Route using Gateway API instead of Ingress
    ingressClass:
      enabled: false

    # Providers
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true

    # Gateway configuration
    gateway:
      listeners:
        web:
          port: 80
          protocol: HTTP
          namespacePolicy:
            from: All

        websecure:
          port: 443
          protocol: HTTPS
          mode: Terminate
          namespacePolicy:
            from: All
          certificateRefs:
            - kind: Secret
              name: letsencrypt-staging
              group: ""

    # Logging
    log:
      level: INFO

    accessLog:
      enabled: true

    # Metrics
    metrics:
      prometheus:
        enabled: true

