---
# Dedicated single-IP pool so the DNS address stays 192.168.1.53 regardless of
# allocation order -- clients (laptop now, router later) hardcode it, so it is
# not allowed to change on a rebuild like a pool-order-assigned IP would.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: adguard-dns
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.53/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: adguard-dns
  namespace: metallb-system
spec:
  ipAddressPools:
    - adguard-dns