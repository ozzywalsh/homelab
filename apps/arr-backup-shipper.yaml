apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-backup-shipper
  namespace: qbitorrent
spec:
  schedule: "30 3 * * *"   # after the apps' own backup schedules run
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: shipper
            image: restic/restic
            command:
            - sh
            - -c
            - |
              restic backup \
                /data/radarr/Backups/scheduled \
                /data/sonarr/Backups/scheduled \
                /data/prowlarr/Backups/scheduled \
                /data/jellyfin/backups \
                --tag arr-native-backups
              restic forget --keep-daily 14 --keep-weekly 8 --prune
            envFrom:
            - secretRef: {name: restic-secret}
            volumeMounts:
            - {name: radarr-config, mountPath: /data/radarr, readOnly: true}
            - {name: sonarr-config, mountPath: /data/sonarr, readOnly: true}
            - {name: prowlarr-config, mountPath: /data/prowlarr, readOnly: true}
            - {name: jellyfin-config, mountPath: /data/jellyfin, readOnly: true}
          restartPolicy: OnFailure
          volumes:
          - {name: radarr-config, persistentVolumeClaim: {claimName: radarr-config}}
          - {name: sonarr-config, persistentVolumeClaim: {claimName: sonarr-config}}
          - {name: prowlarr-config, persistentVolumeClaim: {claimName: prowlarr-config}}
          - {name: jellyfin-config, persistentVolumeClaim: {claimName: jellyfin-config}}
