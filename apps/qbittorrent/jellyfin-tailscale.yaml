# Tailscale proxy deployment for the jellyfin service.
#
# Runs tailscaled in hostNetwork (on the jellyfin-tailscale pod alone) so that
# WireGuard punches direct through the home router's NAT: in a flannel pod
# netns the connection is double-NATed (pod SNAT -> node SNAT -> router), and
# with the router reporting MappingVariesByDestIP: true (hard NAT) STUN hole
# punching never succeeds and every peer stays on DERP.
#
# Jellyfin itself stays in pod netns (jellyfin.yaml) so its plain-HTTP 8096
# listener is not exposed to the LAN; tailscale serve proxies to it over the
# cluster service. Only WireGuard traffic needs to be direct, not the proxied
# bytes.
#
# hostNetwork caveats:
# - one tailscale instance per node (UDP 41641 conflict); this deployment is
#   replicas=1 and ProxyGroup pods run in pod netns, so nothing collides
# - dnsPolicy override is required or containerboot's kube API access breaks
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-tailscale-serve
  namespace: qbitorrent
data:
  # ${TS_CERT_DOMAIN} is substituted by containerboot on read. Proxy target is
  # the in-cluster jellyfin Service, not 127.0.0.1: the jellyfin container now
  # lives in pod netns, not this pod's (host) netns.
  serve.json: |
    {
      "TCP": {
        "443": { "HTTPS": true }
      },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": {
            "/": { "Proxy": "http://jellyfin:8096" }
          }
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jellyfin-tailscale
  namespace: qbitorrent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jellyfin-tailscale
  namespace: qbitorrent
rules:
  # containerboot persists tailscaled state in the "tailscale" kube secret.
  # create cannot be resourceNames-scoped: the object name is not yet known
  # when the authorize check runs
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tailscale]
    verbs: [get, update, patch, delete]
  # tailscaled writes pod events for debugging
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jellyfin-tailscale
  namespace: qbitorrent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jellyfin-tailscale
subjects:
  - kind: ServiceAccount
    name: jellyfin-tailscale
    namespace: qbitorrent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jellyfin-tailscale
  name: jellyfin-tailscale
  namespace: qbitorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin-tailscale
  template:
    metadata:
      labels:
        app: jellyfin-tailscale
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: jellyfin-tailscale
      # Keep the same node as the jellyfin pod so the serve proxy hairpins the
      # traffic locally through the cluster service instead of crossing the
      # CNI overlay. Preferred, not required: jellyfin remains schedulable
      # everywhere, and if it moves this pod stays put until its own restart.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: jellyfin
      volumes:
      - name: tailscale-state
        persistentVolumeClaim:
          claimName: jellyfin-tailscale-state
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      - name: tsconfig
        configMap:
          name: jellyfin-tailscale-serve
      containers:
      - name: tailscale
        image: tailscale/tailscale:v1.102.5
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_ADMIN
        env:
        - name: TS_USERSPACE
          value: "false"
        - name: TS_KUBE_SECRET
          value: tailscale
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: TS_EXTRA_ARGS
          value: "--advertise-tags=tag:k8s --accept-routes"
        - name: TS_HOSTNAME
          value: jellyfin
        - name: TS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: tailscale-oauth
              key: TS_CLIENT_ID
        - name: TS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: tailscale-oauth
              key: TS_CLIENT_SECRET
        # TS_ACCEPT_DNS must stay unset: accepting MagicDNS DNS rewrites the pod
        # resolv.conf to 100.100.100.100, which breaks containerboot's kube API
        # access on subsequent boots (client-side devices use MagicDNS; with
        # dnsPolicy ClusterFirstWithHostNet this sidecar does not need it, and
        # the serve proxy target resolves via kube DNS instead)
        # tailscale serve: TLS 443 -> jellyfin Service 8096 so
        # https://jellyfin.<tailnet>.ts.net works without a port suffix
        # TS_SERVE_CONFIG must be a PATH to a ServeConfig JSON file (containerboot
        # main.go:64); inline JSON is fatal (fsnotify watch on the "directory" fails)
        - name: TS_SERVE_CONFIG
          value: /etc/tsconfig/serve.json
        readinessProbe:
          exec:
            command:
              - /usr/local/bin/tailscale
              - status
          initialDelaySeconds: 5
          periodSeconds: 20
        volumeMounts:
        - mountPath: /var/lib/tailscale
          name: tailscale-state
        - mountPath: /dev/net/tun
          name: tun
        - mountPath: /etc/tsconfig
          name: tsconfig
          readOnly: true