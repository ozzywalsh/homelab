# Make the DNS-01 wildcard the default certificate for the websecure
# entrypoint. Hostnames routed on 443 with `tls: {}` and no secretRef (e.g.
# jellyfin.wlsh.dev from the tailnet) are served with this cert.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: wildcard-wlsh-dev-tls