apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 2h0m0s
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: traefik
      version: "42.1.2"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  install:
    createNamespace: true
  values:
    api:
      dashboard: true
    # hostNetwork: the gateway binds :443 on the node host itself. Tailnet
    # clients reach the node's tailscale IP directly -- a MetalLB VIP is
    # unreachable from the tailnet, so the listener must live in the host
    # netns, same as tailscaled. (NB: chart schema -- hostNetwork is a
    # TOP-LEVEL value, but dnsPolicy lives under deployment.)
    hostNetwork: true
    deployment:
      kind: DaemonSet
      dnsPolicy: ClusterFirstWithHostNet
    # This instance is the tailnet-only gateway (paired with the release
    # `traefik-lan` in helm-traefik-lan.yaml, which owns the MetalLB VIP and
    # everything else). Without a selector it would also load every *.homelab
    # route, so the tailscale IP would answer any Host header -- the leak this
    # split closes: only routes labelled gateway=tailnet are served here.
    providers:
      kubernetesCRD:
        labelSelector: gateway=tailnet
      kubernetesIngress:
        labelSelector: gateway=tailnet
    # single gateway node: replace in-flight (hostNetwork forbids
    # maxUnavailable: 0); updateStrategy is a top-level chart value
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: "100%"
        # maxSurge must not be set when maxUnavailable is non-zero (api
        # validation), and surge is wrong for hostNetwork regardless: the new
        # pod would collide on the node's ports before the old one dies
        maxSurge: 0
    ingressRoute:
      dashboard:
        # Off: the chart's dashboard route has no auth middleware and the
        # entrypoint was reachable unauthenticated from LAN and tailnet
        # (:8080 -> /api/rawdata). Re-expose later behind auth if wanted.
        enabled: false
    ports:
      web:
        # Not exposed: the only HTTP routes worth serving from the tailnet
        # ride websecure+TLS, and nothing scrapes the dashboard here. The
        # listener still binds :8000 in the host netns (chart defaults
        # deep-merge, so an entrypoint can't be deleted from values) but it
        # has no routes and nothing routes to it.
        port: 8000
        exposedPort: 80
        expose:
          default: false
        protocol: TCP
      websecure:
        # Must be 443 (not 8443): with hostNetwork the entrypoint binds the
        # real host port -- tailnet clients hit <node 100.x>:443 directly.
        port: 443
        exposedPort: 443
        expose:
          default: true
        protocol: TCP
      metrics:
        # 9100 is taken by the node exporter on the host (hostNetwork!)
        port: 9101
        exposedPort: 9101
        protocol: TCP
    # runAsUser 0: the default 65532 user cannot bind :443 in the host netns
    # even with NET_BIND_SERVICE in its cap set (kernel refuses unprivileged-
    # bind for non-root uids via this containerd path). A fully privileged
    # container also binds it; root uid + capped capabilities is the middle
    # ground.
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
    service:
      # Off: the hostNetwork pod is reached directly on the node IP (tailscale
      # IP for the tailnet, node LAN IP for on-LAN callers). The LoadBalancer
      # VIP 192.168.1.200 belongs to the `traefik-lan` release now; leaving a
      # second LoadBalancer here would have both Services claiming the same
      # MetalLB address.
      enabled: false