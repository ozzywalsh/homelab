apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 2h0m0s
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: traefik
      version: "41.0.2"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  install:
    createNamespace: true
  values:
    api:
      dashboard: true
    # hostNetwork: the gateway binds :443 on the node host itself. Tailnet
    # clients reach the node's tailscale IP directly -- a MetalLB VIP is
    # unreachable from the tailnet, so the listener must live in the host
    # netns, same as tailscaled. (NB: chart schema -- hostNetwork is a
    # TOP-LEVEL value, but dnsPolicy lives under deployment.)
    hostNetwork: true
    deployment:
      kind: DaemonSet
      dnsPolicy: ClusterFirstWithHostNet
    # single gateway node: replace in-flight (hostNetwork forbids
    # maxUnavailable: 0); updateStrategy is a top-level chart value
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: "100%"
        # maxSurge must not be set when maxUnavailable is non-zero (api
        # validation), and surge is wrong for hostNetwork regardless: the new
        # pod would collide on the node's ports before the old one dies
        maxSurge: 0
    ingressRoute:
      dashboard:
        enabled: true
    ports:
      web:
        port: 8000
        exposedPort: 80
        expose:
          default: true
        protocol: TCP
      websecure:
        # Must be 443 (not 8443): with hostNetwork the entrypoint binds the
        # real host port -- tailnet clients hit <node 100.x>:443 directly.
        port: 443
        exposedPort: 443
        expose:
          default: true
        protocol: TCP
      metrics:
        # 9100 is taken by the node exporter on the host (hostNetwork!)
        port: 9101
        exposedPort: 9101
        protocol: TCP
    service:
      annotations:
        metallb.io/loadBalancerIPs: "192.168.1.200"
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local