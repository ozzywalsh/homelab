apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  # traefik must run in the host netns (tailnet listeners must bind the node
  # host -- a MetalLB VIP is unreachable from the tailnet), which violates
  # the default baseline PodSecurity.
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged