---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-pv
  namespace: qbitorrent
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "media"
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: media
    volumeAttributes:
      server: 192.168.1.62
      share: /tank/media
  mountOptions:
    - hard
    - nfsvers=3
    - nolock
---
apiVersion: v1
kind: PersistentVolumeClaim
