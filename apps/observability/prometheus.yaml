apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
        containers:
          - name: prometheus
            image: quay.io/prometheus/prometheus:v3.14.0
            volumeMounts:
              - name: config-volume
                mountPath: /etc/prometheus
              - name: data-volume
                mountPath: /prometheus
        volumes:
          - name: config-volume
            configMap:
              name: prometheus-config
          - name: data-volume
            persistentVolumeClaim:
              claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: observability
spec:
  entryPoints:
    - web 
  routes:
    - match: Host(`prometheus.homelab`)
      kind: Rule
      services:
        - name: prometheus
          port: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
    scrape_configs:
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
    - job_name: node-exporter
      static_configs:
      - targets:
        - node-exporter.observability.svc.cluster.local:9100
    - job_name: kube-state-metrics
      static_configs:
      - targets:
        - kube-state-metrics.observability.svc.cluster.local:8080
    - job_name: freebsd-nas
      static_configs:
      - targets:
        - 192.168.1.62:9100
    - job_name: manderley-proxy
      static_configs:
      - targets:
        - ts-manderley-proxy-4f25c.tailscale.svc.cluster.local:9100
