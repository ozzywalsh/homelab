apiVersion: v1
kind: Namespace
metadata:
  name: qbitorrent
  labels:
    # NET_ADMIN (gluetun VPN, tailscale sidecar) + /dev/net/tun hostPath
    # are required by pods here; they violate the baseline PodSecurity level
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged