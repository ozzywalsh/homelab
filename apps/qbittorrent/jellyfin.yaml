# tailscale runs as a separate hostNetwork deployment (jellyfin-tailscale.yaml)
# rather than a sidecar: its WireGuard traffic needs the node's netns to punch
# direct through the home router's NAT, but jellyfin itself must stay in pod
# netns so 8096 is not exposed to the LAN.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jellyfin
  name: jellyfin
  namespace: qbitorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      volumes:
      - name: jellyfin-config
        persistentVolumeClaim:
          claimName: jellyfin-config-pvc
      - name: jellyfin-data
        persistentVolumeClaim:
          claimName: media
      - name: jellyfin-backups
        persistentVolumeClaim:
          claimName: jellyfin-backups
      containers:
      - env:
        - name: TZ
          value: Europe/Dublin
        image: jellyfin/jellyfin:12.0
        name: jellyfin
        ports:
        - containerPort: 8096
          name: http-tcp
          protocol: TCP
        - containerPort: 8920
          name: https-tcp
          protocol: TCP
        - containerPort: 1900
          name: dlna-udp
          protocol: UDP
        - containerPort: 7359
          name: discovery-udp
          protocol: UDP
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "4000m"
            memory: "16Gi"
            devic.es/amd-render: 1
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - mountPath: /config
          name: jellyfin-config
        - mountPath: /config/data/backups
          name: jellyfin-backups
        - mountPath: /data
          name: jellyfin-data
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: qbitorrent
spec:
  selector:
    app: jellyfin
  ports:
    - protocol: TCP
      port: 8096
      targetPort: 8096
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: qbitorrent
spec:
  entryPoints:
    - web 
  routes:
    - match: Host(`jellyfin.homelab`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096
    - match: Host(`jellyfin.ozzywalsh.com`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096
