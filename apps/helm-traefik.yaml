apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 2h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "41.0.2"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik

  install:
    createNamespace: true

  values:
    api:
      dashboard: true

    ingressRoute:
      dashboard:
        enabled: false

    ports:
      websecure-external:
        nodePort: 30443
      websecure-internal:
        nodePort: 8443

    service:
      spec:
        type: NodePort
