apiVersion: v1
kind: Namespace
metadata:
  name: qbitorrent
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-downloads-pvc
  namespace: qbitorrent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-pvc
  namespace: qbitorrent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbitorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbitorrent
  template:
    metadata:
      labels:
        app: qbitorrent
    spec:
      containers:

      - name: gluetun
        image: ghcr.io/qdm12/gluetun:v3.41.1
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        env:
          - name: VPN_SERVICE_PROVIDER
            value: protonvpn

          - name: VPN_TYPE
            value: wireguard

          # Store these in a Secret in production
          - name: WIREGUARD_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: proton-wireguard
                key: private-key

          - name: WIREGUARD_ADDRESSES
            value: "10.2.0.2/32"

          # Optional
          - name: TZ
            value: Europe/Dublin

          # Enable Proton port forwarding if supported
          - name: VPN_PORT_FORWARDING
            value: "on"

        volumeMounts:
          - name: tun
            mountPath: /dev/net/tun

        ports:
          - containerPort: 8080
          - containerPort: 31456

      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:5.2.2

        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: Europe/Dublin
          - name: WEBUI_PORT
            value: "8080"

        volumeMounts:
          - name: config
            mountPath: /config
          - name: downloads
            mountPath: /downloads

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc

        - name: downloads
          persistentVolumeClaim:
            claimName: qbittorrent-downloads-pvc

        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-web
  namespace: qbitorrent
spec:
  type: ClusterIP
  selector:
    app: qbitorrent
  ports:
    - name: web-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: qbitorrent
spec:
  entryPoints:
    - web 
  routes:
    - match: Host(`qbittorrent.local`)
      kind: Rule
      services:
        - name: qbittorrent-web
          port: 8080
