apiVersion: v1
kind: Namespace
metadata:
  name: qbitorrent
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  namespace: qbitorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nzbget
  template:
    metadata:
      labels:
        app: nzbget
    spec:
      containers:
      - name: nzbget
        image: lscr.io/linuxserver/nzbget:26.2
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: Europe/Dublin
        volumeMounts:
          - name: config
            mountPath: /config
          - name: data
            mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nzbget-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: media
---
apiVersion: v1
kind: Service
metadata:
  name: nzbget-web
  namespace: qbitorrent
spec:
  type: ClusterIP
  selector:
    app: nzbget
  ports:
    - name: web-tcp
      protocol: TCP
      port: 6789
      targetPort: 6789
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: qbitorrent
spec:
  entryPoints:
    - web 
  routes:
    - match: Host(`nzbget.homelab`)
      kind: Rule
      services:
        - name: nzbget-web
          port: 6789
