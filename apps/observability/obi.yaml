apiVersion: v1
kind: ServiceAccount
metadata:
  name: obi-collector
  namespace: obi-system
# ...
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obi
rules:
  - apiGroups: ['apps']
    resources: ['replicasets']
    verbs: ['list', 'watch']
  - apiGroups: ['']
    resources: ['pods', 'services', 'nodes']
    verbs: ['list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obi
subjects:
  - kind: ServiceAccount
    name: obi-collector
    namespace: obi-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obi
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: obi-collector
  namespace: obi-system
spec:
  mode: daemonset
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
  serviceAccount: obi-collector
  hostPID: true
  observability:
    metrics:
      enableMetrics: true
  securityContext:
    runAsUser: 0
    readOnlyRootFilesystem: true
    capabilities:
      add:
        - BPF
        - SYS_PTRACE
        - NET_RAW
        - CHECKPOINT_RESTORE
        - DAC_READ_SEARCH
        - PERFMON
        - SYS_ADMIN
      drop:
        - ALL
  tolerations:
    - effect: NoSchedule
      operator: Exists
    - effect: NoExecute
      operator: Exists
  volumes:
    - name: var-run-obi
      emptyDir: {}
    - name: cgroup
      hostPath:
        path: /sys/fs/cgroup
    - name: bpffs
      hostPath:
        path: /sys/fs/bpf
    - name: tracefs
      hostPath:
        path: /sys/kernel/tracing
  volumeMounts:
    - name: var-run-obi
      mountPath: /var/run/obi
    - name: cgroup
      mountPath: /sys/fs/cgroup
    - name: bpffs
      mountPath: /sys/fs/bpf
    - name: tracefs
      mountPath: /sys/kernel/tracing
  config:
    receivers:
      obi:
        discovery:
          instrument:
            - k8s_namespace: qbitorrent
            - k8s_namespace: obi-store-demo
        attributes:
          kubernetes:
            enable: "true"
        internal_metrics:
          exporter: otel
    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
    service:
      pipelines:
        metrics:
          receivers: [obi]
          exporters: [prometheus]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: obi-collector-monitor
  namespace: obi-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: obi-collector-collector
      app.kubernetes.io/component: opentelemetry-collector
  endpoints:
    - port: prometheus
      interval: 15s
      path: /metrics
