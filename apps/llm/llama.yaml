apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-models
  namespace: llm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 32Gi

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority-llm
value: -10
globalDefault: false
description: LLM workloads should yield to important services

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama
  namespace: llm
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: llama

  template:
    metadata:
      labels:
        app: llama

    spec:
      priorityClassName: low-priority-llm

      terminationGracePeriodSeconds: 120

      containers:
        - name: llama

          image: ghcr.io/ggml-org/llama.cpp:server

          imagePullPolicy: IfNotPresent

          command:
            - /app/llama-server

          args:

            # --------------------------------------------------
            # Model
            # --------------------------------------------------

            - --hf-repo
            - tensorblock/Qwen_Qwen3-Coder-30B-A3B-Instruct-GGUF

            - --hf-file
            - Qwen3-Coder-30B-A3B-Instruct-Q3_K_M.gguf

            # --------------------------------------------------
            # HTTP API
            # --------------------------------------------------

            - --host
            - 0.0.0.0

            - --port
            - "8080"

            # --------------------------------------------------
            # CPU
            # --------------------------------------------------

            - --threads
            - "12"

            - --threads-batch
            - "12"

            # --------------------------------------------------
            # Context / concurrency
            # --------------------------------------------------

            - --ctx-size
            - "16384"

            - --parallel
            - "1"

            # --------------------------------------------------
            # Batching
            # --------------------------------------------------

            - --batch-size
            - "512"

            - --ubatch-size
            - "256"

            - --cont-batching

            # --------------------------------------------------
            # Monitoring
            # --------------------------------------------------

            - --metrics

          env:
            # Persist llama.cpp's HF model cache.
            - name: LLAMA_CACHE
              value: /models/.cache

          resources:
            requests:
              cpu: "4"
              memory: "18Gi"

            limits:
              cpu: "12"
              memory: "32Gi"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: models
              mountPath: /models

          startupProbe:
            httpGet:
              path: /health
              port: http

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health
              port: http

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http

            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models

---
apiVersion: v1
kind: Service
metadata:
  name: llama
  namespace: llm

spec:
  type: ClusterIP

  selector:
    app: llama

  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
