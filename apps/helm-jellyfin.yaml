apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: qbitorrent
spec:
  interval: 2h0m0s
  url: https://jellyfin.github.io/jellyfin-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: qbitorrent
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: qbitorrent # for convenience; might change later
  install:
    createNamespace: true
  values:
    replicaCount: 1
    persistence:
      config:
        enabled: true
        size: 5Gi
        storageClass: 'local-path'
      media:
        enabled: true
        existingClaim: "qbittorrent-downloads-pvc"
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "4000m"
        memory: "4Gi"
    volumes:
      - name: dri
        hostPath:
          path: /dev/dri
    volumeMounts:
      - name: dri
        mountPath: /dev/dri
    ingress:
      enabled: false
      className: 'traefik'
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure-external
        cert-manager.io/issuer: "letsencrypt-staging"
      hosts:
        - host: jellyfin.local
          paths:
            - path: /
              pathType: Prefix
        - host: home.ozzywalsh.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: "letsencrypt-staging"
          hosts:
            - home.ozzywalsh.com
    httpRoute:
      enabled: true
      annotations: {}
      # -- Gateway references to attach this HTTPRoute to
      parentRefs: 
        - name: traefik-gateway
          namespace: traefik-external
          sectionName: websecure
          kind: Gateway
      # -- Hostnames to match for this HTTPRoute
      hostnames: 
        - jellyfin.ozzywalsh.com
      # -- Rules for routing traffic
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
